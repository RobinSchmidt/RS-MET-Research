[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prosampler"
version = "0.1.0.dev0"
description = "Design of FIR up/down-sampling filter pairs whose oversampling roundtrip is an exact identity (perfect reconstruction)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
